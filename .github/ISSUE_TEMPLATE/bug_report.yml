name: Bug report
description: Something does not behave the way it should.
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    id: ran
    attributes:
      label: What did you run?
      description: The exact command or steps. Remove API keys before pasting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead?
      description: Include error messages and output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release version, or the commit you ran.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version.
