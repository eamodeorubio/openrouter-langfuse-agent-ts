# Every eval case, core and full. The runner (`src/run.ts`) keeps the core ones
# by filtering on `metadata.set`, unless you pass `--set full`. It runs the
# built CLI against real models, so it costs money and needs OPENROUTER_API_KEY.
# Run it with `pnpm --filter ask-openrouter-evals run eval`, and only when you
# mean to.
description: ask-openrouter evals

prompts:
  - '{{question}}'

providers:
  - id: file://src/provider/cli.ts
    label: ask-openrouter-cli

# Every case passes through the checks of the three universal error classes. The
# order is the order of the precedence: a later check does not judge a run an
# earlier class already failed.
defaultTest:
  options:
    # The grader of the rubrics that cases list (see rubrics/): Jev 1.14 through OpenRouter, behind a
    # check of the size of the state. It reads OPENROUTER_API_KEY from the
    # environment when it grades, so no key is written here. A rubric scores
    # the probability of yes, and passes at or above the threshold. The
    # threshold is stated, not left to a default, until it is calibrated.
    provider:
      id: file://src/judge/provider.ts
      config:
        threshold: 0.5
  vars:
    # The matrix: promptfoo runs every case once per model.
    model:
      - nvidia/nemotron-3-ultra-550b-a55b:free
      - anthropic/claude-haiku-5.5
  assert:
    - type: javascript
      metric: run-failed
      value: file://src/checks/assertions.ts:runFailed
    - type: javascript
      metric: memory-answer
      value: file://src/checks/assertions.ts:memoryAnswer
    - type: javascript
      metric: invented-data
      value: file://src/checks/assertions.ts:inventedModels

# The cases live in `cases/`, one file for each family of question. A case
# carries its code in `metadata.id`, as `family/short-name`, and `metadata.set`
# says whether the core run asks it: `core` or `full`.
tests: file://cases/*.yaml
