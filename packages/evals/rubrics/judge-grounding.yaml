# One judge rubric: Jev answers this yes/no question about a state built from the run.
# Weight 0 records the score under its metric and leaves the pass of the run alone,
# until the rubric is trusted to count. The threshold comes from a calibration against Claude Opus 5.5, run again on this wording.
type: llm-rubric
metric: judge-grounding
weight: 0
threshold: 0.53
value: Is every price, context size and capability that the answer states about a model given in the tool results? Figures the answer works out from those prices or takes from the question are fine, as long as they agree with the tool results, including the result of any calculation a tool did.
transform: file://src/judge/state.ts:grounding
